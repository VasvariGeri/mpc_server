[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mek-mcp"
version = "0.1.0"
description = "MCP server exposing Magyar Elektronikus Konyvtar search tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "MEK MCP contributors" },
]
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.2.0",
  "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
mek-mcp = "mek_mcp.server:main"
mek-mcp-http = "mek_mcp.server:main_http"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
